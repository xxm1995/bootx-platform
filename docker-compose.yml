version: '3'
services:
  platform:
    image: bootx-platform:latest
    restart: always
    ports:
      - "9999:9999"
    environment:
      - JAVA_OPTS= -Xms256m -Xmx1G -Dlogging.config=./logback-spring.xml
    volumes:
      # 读取外部化配置文件(根据实际服务器环境做修改), 宿主机目录:容器目录
      - ./logs/:/logs # 日志
      - ./files/:/data/files # 上传文件目录
      - ./application-dev.yml:/application-dev.yml # 配置
      - ./logback-spring.xml:/logback-spring.xml # 日志框架
      - ./ip2region/ip2region.xdb :/data/ip2region/ip2region.xdb # ip归属地数据库
